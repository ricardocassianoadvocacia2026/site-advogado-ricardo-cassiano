<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 225" width="225" height="225">
  <defs>
    <!-- Gradiente Dourado Metálico Original -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b56a27"/>
      <stop offset="15%" stop-color="#dfae4f"/>
      <stop offset="35%" stop-color="#f5ea75"/>
      <stop offset="55%" stop-color="#dfae4f"/>
      <stop offset="80%" stop-color="#f5ea75"/>
      <stop offset="100%" stop-color="#b56a27"/>
    </linearGradient>
    <linearGradient id="goldIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b459"/>
      <stop offset="30%" stop-color="#f5ea75"/>
      <stop offset="70%" stop-color="#dfae4f"/>
      <stop offset="100%" stop-color="#b56a27"/>
    </linearGradient>
    <radialGradient id="cardInnerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182324"/>
      <stop offset="100%" stop-color="#0c1516"/>
