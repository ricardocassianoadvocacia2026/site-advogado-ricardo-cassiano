    <path d="M90 0H10C4.5 0 0 4.5 0 10v70c0 5.5 4.5 10 10 10h80c5.5 0 10-4.5 10-10V10c0-5.5-4.5-10-10-10zm-3.6 11.2L50 43.8 13.6 11.2h72.8zM8.8 77.6V18.1l39 34.6c1.2 1.1 2.8 1.7 4.2 1.7 1.5 0 3-.6 4.2-1.7l39-34.6v59.5H8.8z"/>
